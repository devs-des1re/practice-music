name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Tell us what would make practising better for you.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Player and loops
        - Metronome
        - Mixer and routing
        - Library and downloads
        - Stem separation
        - MIDI and timing analysis
        - Settings
        - Other
    validations:
      required: true
