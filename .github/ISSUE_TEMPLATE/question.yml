name: Question
description: Ask how something works or how to set it up.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: Check the README and existing issues first, then ask your question here.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Explain what you are trying to do and where you are stuck.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Operating system, audio interface, kit and amp, if relevant.
