[package]
name = "pm-engine"
version = "0.1.0"
edition = "2024"
publish = false

[features]
asio = ["cpal/asio"]
jack = ["cpal/jack"]

[dependencies]
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = "0.6.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[target."cfg(windows)".dependencies]
wasapi = "0.27.0"
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_Media_Audio", "Win32_Foundation"] }
